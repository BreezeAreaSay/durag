# Continuous deployment over SSH. Required repository secrets:
#   DEPLOY_HOST      server address
#   DEPLOY_USER      ssh user (member of the docker group)
#   DEPLOY_SSH_KEY   private key whose public half is in ~/.ssh/authorized_keys
#   DEPLOY_PORT      (optional) ssh port, default 22
#   DEPLOY_PATH      (optional) checkout path on the server, default /opt/durag
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and redeploy on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/durag' }}
            git fetch --all --prune
            git checkout ${{ github.ref_name }}
            git pull --ff-only
            ./deploy/deploy.sh
